[package]
name = "lit_analysis"
version = "0.1.0"
edition = "2024"
description = "Shared Lit component semantic analysis, decorator extraction, template IR, and classification engine"

[features]
default = ["template-ir"]
template-ir = ["dep:html5ever", "dep:markup5ever_rcdom"]

[dependencies]
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_ast = { workspace = true }
oxc_semantic = { workspace = true }
oxc_syntax = { workspace = true }

html5ever = { workspace = true, optional = true }
markup5ever_rcdom = { workspace = true, optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
