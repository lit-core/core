<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nordic studio desk</title>
    <style>
      html {
        font-size: 16px;
        background-color: #fafafb;
        color: #18181b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        margin: 0;
        background-color: #fafafb;
        color: #18181b;
      }

      .page-container {
        width: 100%;
        max-width: 1600px;
        margin: 0 auto;
        padding: 2rem clamp(1.5rem, 4vw, 3.5rem);
        box-sizing: border-box;
      }

      .page-header {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .page-title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 300;
        color: #09090b;
        letter-spacing: -0.02em;
      }

      .page-subtitle {
        margin: 0;
        font-size: 1rem;
        font-weight: 300;
        color: #71717a;
      }

      .sections-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr));
        gap: 2rem;
        align-items: start;
      }

      .section-block {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .section-heading {
        margin: 0;
        padding-inline: 0.25rem;
        font-size: 1.125rem;
        font-weight: 500;
        color: #09090b;
        letter-spacing: -0.015em;
      }

      .pending-copy {
        margin: 0;
        padding: 1.5rem;
        font-size: 1rem;
        font-weight: 300;
        color: #71717a;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="page-container page-header">
      <h1 class="page-title">Nordic studio desk</h1>
      <p class="page-subtitle">Solid European timber worktable crafted in Stockholm</p>
    </header>

    <main class="page-container">
      <div class="sections-grid">
        <section class="section-block">
          <h2 class="section-heading">Edition and engraving</h2>
          <product-edition-picker edition="oak"></product-edition-picker>
        </section>

        <section class="section-block">
          <h2 class="section-heading">Regional warehouse availability</h2>
          <warehouse-stock-panel sku="nordic-desk-01">
            <p slot="pending" class="pending-copy">Checking Stockholm warehouse stock...</p>
          </warehouse-stock-panel>
        </section>

        <section class="section-block">
          <h2 class="section-heading">Freight and delivery schedule</h2>
          <freight-quote-panel sku="nordic-desk-01" region="stockholm">
            <p slot="pending" class="pending-copy">Estimating regional freight schedule...</p>
          </freight-quote-panel>
        </section>
      </div>
    </main>
  </body>
</html>
