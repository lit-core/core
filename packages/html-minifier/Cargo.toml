[package]
name = "html_minifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.10.5", features = ["serde-json"] }
napi-derive = "3.5.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# OXC stack — matching workspace versions
oxc_allocator = "0.151.0"
oxc_parser = "0.151.0"
oxc_ast = "0.151.0"
oxc_span = "0.151.0"
oxc_codegen = "0.151.0"
oxc_traverse = "0.151.0"
oxc_semantic = "0.152.0"

# Diagnostics / Error handling
thiserror = "2.0"

[build-dependencies]
napi-build = "2.3.2"
