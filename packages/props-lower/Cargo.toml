[package]
name = "props_lower"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.10.5", features = ["serde-json"] }
napi-derive = "3.5.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# OXC stack — latest stable
oxc_allocator = "0.151.0"
oxc_parser = "0.151.0"
oxc_ast = "0.151.0"
oxc_span = "0.151.0"
oxc_codegen = "0.151.0"
oxc_traverse = "0.152.0"

# Diagnostics
thiserror = "2.0"

[dev-dependencies]
insta = { version = "1.41", features = ["json", "redactions"] }

[build-dependencies]
napi-build = "2.3.2"
