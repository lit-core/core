name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Monthly scheduled check on the first day of each month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome check
        run: pnpm run lint

  rust:
    name: Rust formatting, clippy, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check all Rust packages
        run: |
          for pkg in css-fuse props-lower css-minifier html-minifier html-fuse native event-hoist memoize elem-proxy dom-paths dirty-mask html-aot resumable; do
            echo "Checking fmt for $pkg..."
            cargo fmt --check --manifest-path packages/$pkg/Cargo.toml
          done

      - name: Clippy all Rust packages
        run: |
          for pkg in css-fuse props-lower css-minifier html-minifier html-fuse native event-hoist memoize elem-proxy dom-paths dirty-mask html-aot resumable; do
            echo "Running clippy for $pkg..."
            cargo clippy --manifest-path packages/$pkg/Cargo.toml -- -D warnings
          done

      - name: Run Rust unit and integration tests
        run: |
          for pkg in css-fuse props-lower css-minifier html-minifier html-fuse native event-hoist memoize elem-proxy dom-paths dirty-mask html-aot resumable; do
            echo "Running cargo test for $pkg..."
            cargo test --manifest-path packages/$pkg/Cargo.toml
          done

  test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build workspaces
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Run bundler integration tests
        run: |
          node packages/vite-plugin/tests/integration.test.js
          node packages/webpack-plugin/tests/integration.test.js
