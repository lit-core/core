name: Deploy unified documentation, benchmarks, and showcase to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/benchmarks/**'
      - 'packages/showcase/**'
      - 'packages/tests/**'
      - 'packages/css-fuse/**'
      - 'packages/html-fuse/**'
      - 'packages/props-lower/**'
      - 'packages/html-aot/**'
      - 'packages/dom-paths/**'
      - 'packages/dirty-mask/**'
      - 'packages/event-hoist/**'
      - 'packages/memoize/**'
      - 'packages/elem-proxy/**'
      - 'packages/native/**'
      - 'packages/resumable/**'
      - 'packages/css-minifier/**'
      - 'packages/html-minifier/**'
      - 'packages/tag-shake/**'
      - 'packages/directives/**'
      - 'packages/vite-plugin/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build showcase and benchmark dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm run build

      - name: Build component test showcase
        run: node packages/showcase/build.js

      - name: Build React benchmark viewer dashboard
        run: pnpm --filter @lit-core/benchmarks run viewer:build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/benchmarks/viewer/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
