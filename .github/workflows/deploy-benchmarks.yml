name: Deploy benchmark dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/benchmarks/**'
      - 'packages/css-fuse/**'
      - 'packages/html-fuse/**'
      - 'packages/props-lower/**'
      - 'packages/html-aot/**'
      - 'packages/dom-paths/**'
      - 'packages/dirty-mask/**'
      - 'packages/event-hoist/**'
      - 'packages/memoize/**'
      - 'packages/elem-proxy/**'
      - 'packages/native/**'
      - 'packages/resumable/**'
      - 'packages/css-minifier/**'
      - 'packages/html-minifier/**'
      - 'packages/vite-plugin/**'
      - '.github/workflows/deploy-benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build benchmark artifacts and viewer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build monorepo packages
        run: pnpm run build

      - name: Run benchmark matrix
        run: node packages/benchmarks/src/index.js --suite=all

      - name: Build React viewer dashboard
        run: pnpm --filter @lit-core/benchmarks run viewer:build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/benchmarks/viewer/dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
