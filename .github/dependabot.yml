version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"

updates:
  # Monthly dependency updates for pnpm workspace packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    groups:
      all-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"

  # Monthly dependency updates for Rust packages
  - package-ecosystem: "cargo"
    directories:
      - "/packages/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    groups:
      all-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"

  # Monthly updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    groups:
      all-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "actions"
