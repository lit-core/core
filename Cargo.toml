[workspace]
resolver = "3"
members = [
    "crates/lit-analysis",
    "packages/transforms/css-fuse",
    "packages/transforms/css-minifier",
    "packages/transforms/dirty-mask",
    "packages/transforms/directives",
    "packages/transforms/dom-paths",
    "packages/transforms/elem-proxy",
    "packages/transforms/event-hoist",
    "packages/transforms/html-aot",
    "packages/transforms/html-fuse",
    "packages/transforms/html-minifier",
    "packages/transforms/memoize",
    "packages/transforms/props-lower",
    "packages/transforms/tag-shake",
    "packages/targets/morph-to-react",
    "packages/targets/native",
    "packages/rendering/resumable",
    "packages/rendering/ssr",
]

[workspace.dependencies]
# NAPI-RS native bindings
napi = { version = "3.13.0", features = ["serde-json"] }
napi-derive = "3.6.9"
napi-build = "2.5.0"

# Core serialization & error handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# File matching & hashing
glob = "0.3"
blake3 = "1.8"

# CLI & diagnostics
clap = { version = "4.6", features = ["derive"] }
miette = { version = "7.6", features = ["fancy"] }
insta = { version = "1.48", features = ["json", "redactions"] }

# Internal shared analysis crate
lit_analysis = { path = "crates/lit-analysis", default-features = false }

# Spec-compliant HTML5 parser
html5ever = "0.27"
markup5ever_rcdom = "0.3"

# CSS processing
lightningcss = "1.0.0-alpha.72"

# OXC compiler stack
oxc_allocator = "0.151.0"
oxc_ast = "0.151.0"
oxc_ast_visit = "0.151.0"
oxc_codegen = "0.151.0"
oxc_parser = "0.151.0"
oxc_semantic = "0.151.0"
oxc_span = "0.151.0"
oxc_syntax = "0.151.0"
oxc_traverse = "0.151.0"

[profile.release]
opt-level = 2
codegen-units = 256
lto = false
debug = false
strip = "debuginfo"

